<!DOCTYPE html><html lang="de" class="h-full bg-white"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TC Muckensturm - Meine Daten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            club: '#1466A8',
            ink: '#0A1624',
          },
          fontFamily: {
            heading: ['"Space Grotesk"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      color: #0A1624;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
    .field-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
  </style>
</head>
<body class="bg-white min-h-screen text-ink antialiased flex justify-center">

  <!-- iPhone frame container (393px width) -->
  <div class="w-full max-w-[393px] min-h-screen bg-white relative flex flex-col justify-between select-none">
    
    <!-- Top Content Area -->
    <div class="flex-1 flex flex-col">
      
      <!-- iOS Status Bar -->
      <div class="pt-3 px-6 flex justify-between items-center text-xs font-semibold tracking-tight text-ink">
        <span>9:41</span>
        <div class="flex items-center gap-1.5 text-ink">
          <svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
            <rect x="0" y="8" width="3" height="4" rx="0.5"></rect>
            <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5"></rect>
            <rect x="9" y="3" width="3" height="9" rx="0.5"></rect>
            <rect x="13.5" y="0.5" width="3" height="11.5" rx="0.5"></rect>
          </svg>
          <svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
            <path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.1L15.6 4C13.6 2.1 10.9 1 8 1C5.1 1 2.4 2.1 0.4 4L1.5 5.1C3.2 3.5 5.5 2.5 8 2.5ZM8 6.5C9.5 6.5 10.8 7.1 11.8 8.1L12.9 7C11.6 5.8 9.9 5 8 5C6.1 5 4.4 5.8 3.1 7L4.2 8.1C5.2 7.1 6.5 6.5 8 6.5ZM8 10C8.7 10 9.3 10.3 9.7 10.7L8 12.4L6.3 10.7C6.7 10.3 7.3 10 8 10Z"></path>
          </svg>
          <div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
            <div class="bg-current h-full w-full rounded-2xs"></div>
          </div>
        </div>
      </div>

      <!-- Navigation & Header -->
      <div class="px-5 pt-4 pb-2">
        <div class="flex items-center gap-3 py-1"><a href="#" class="w-10 h-10 rounded-full bg-[#F1F5F9] text-[#334155] flex items-center justify-center transition-opacity hover:opacity-80 active:opacity-60 shrink-0"><span class="material-symbols-outlined text-[20px] leading-none">chevron_left</span></a><span class="text-[#1466A8] text-[14px] font-semibold font-heading">Konto</span></div>
        <h1 class="font-heading text-[24px] font-bold text-ink mt-2 tracking-tight">Meine Daten</h1>
      </div>

      <!-- Scrollable / Main Form Content -->
      <div class="px-5 pt-3 pb-28 space-y-4"><!-- Name Group: Vorname & Nachname -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="field-label block mb-1.5">Vorname</label>
            <input type="text" value="Anna" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] font-medium text-[#0F172A] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
          </div>
          <div>
            <label class="field-label block mb-1.5">Nachname</label>
            <input type="text" value="Berger" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] font-medium text-[#0F172A] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
          </div>
        </div>

        <!-- Titel (leer) -->
        <div>
          <label class="field-label block mb-1.5">Titel (optional)</label>
          <input type="text" placeholder="z. B. Dr." value="" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] text-[#0F172A] placeholder-slate-400 focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
        </div>

        <!-- Kontakt: Telefon & Mobil -->
        <div class="space-y-4 pt-1">
          <div>
            <label class="field-label block mb-1.5">Telefon</label>
            <input type="tel" placeholder="Festnetznummer" value="" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] font-['Space_Grotesk'] text-[#0F172A] placeholder-slate-400 focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
          </div>

          <div>
            <label class="field-label block mb-1.5">Mobil</label>
            <input type="tel" value="0171 2345678" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] font-medium font-['Space_Grotesk'] text-[#0F172A] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
          </div>
        </div>

        <!-- Adresse: Straße & Hausnummer -->
        <div class="pt-1">
          <label class="field-label block mb-1.5">Straße und Hausnummer</label>
          <input type="text" value="Lindenweg 12" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] font-medium text-[#0F172A] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
        </div>

        <!-- PLZ & Ort -->
        <div class="grid grid-cols-[110px_1fr] gap-3">
          <div>
            <label class="field-label block mb-1.5">PLZ</label>
            <input type="text" value="68519" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] font-medium font-['Space_Grotesk'] text-[#0F172A] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
          </div>
          <div>
            <label class="field-label block mb-1.5">Ort</label>
            <input type="text" value="Viernheim" class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full text-[15px] font-medium text-[#0F172A] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-colors">
          </div>
        </div>

        <!-- Nur lesbare Daten (Schreibgeschützt) -->
        <div class="pt-4 border-t border-slate-200 space-y-3">
          <div>
            <label class="field-label block mb-1.5">E-Mail</label>
            <div class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full flex items-center justify-between text-[15px] text-slate-500 font-medium">
              <span>anna.berger@beispiel.de</span>
              <span class="material-symbols-outlined text-[18px] text-slate-400">lock</span>
            </div>
          </div>

          <div>
            <label class="field-label block mb-1.5">Geburtsdatum</label>
            <div class="w-full h-[52px] px-4 bg-[#F8FAFC] border border-[#E2E8F0] rounded-full flex items-center justify-between text-[15px] text-slate-500 font-medium font-['Space_Grotesk']">
              <span>14.03.1984</span>
              <span class="material-symbols-outlined text-[18px] text-slate-400">lock</span>
            </div>
          </div>

          <!-- Hinweis -->
          <div class="pt-1">
            <p class="text-[13px] leading-relaxed text-slate-500 font-['DM_Sans']">
              E-Mail und Geburtsdatum ändert der Vorstand. Jede Änderung wird protokolliert.
            </p>
          </div>
        </div></div>

    </div>

    <!-- Fester Fußbereich mit Hauptbutton -->
    <div class="fixed bottom-0 left-0 right-0 max-w-[393px] mx-auto bg-white/95 backdrop-blur-md border-t border-slate-100 px-5 pt-3.5 pb-8 z-30">
      <button type="button" class="w-full h-[56px] bg-[#1466A8] text-white font-semibold font-heading text-[16px] rounded-full shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center tracking-normal">Speichern</button>
      <div class="w-32 h-1 bg-slate-200 rounded-full mx-auto mt-4"></div>
    </div>

  </div>




</body></html>
