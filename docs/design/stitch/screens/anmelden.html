<body class="h-full bg-white text-on-surface antialiased flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Viewport Shell (Simulated iPhone canvas centered for desktop view, full bleed on mobile) -->
<div class="relative w-full max-w-md mx-auto min-h-screen bg-white flex flex-col justify-between overflow-x-hidden">
<!-- Top Section: Status Bar + Back link/Header -->
<div>
<!-- iOS Native Status Bar (44px) -->
<div class="w-full h-11 px-6 flex items-center justify-between text-on-surface select-none pt-1">
<span class="font-numeric-data text-[15px] font-semibold tracking-tight text-on-surface">9:41</span>
<div class="flex items-center space-x-2 text-on-surface">
<!-- Cell Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="3" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="3" x="4.5" y="5.5"></rect>

</svg>
<!-- Wifi -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-4.24-4.24a6 6 0 0 1 8.48 0 .75.75 0 0 0 1.06-1.06 7.5 7.5 0 0 0-10.6 0 .75.75 0 1 0 1.06 1.06zm-2.83-2.83a10 10 0 0 1 14.14 0 .75.75 0 1 0 1.06-1.06 11.5 11.5 0 0 0-16.26 0 .75.75 0 0 0 1.06 1.06z"></path>
</svg>
<!-- Battery -->
<div class="relative w-6 h-3 border border-on-surface rounded-sm p-0.5 flex items-center">
<div class="h-full w-4 bg-on-surface rounded-2xs"></div>
<div class="absolute -right-1 top-1 w-0.5 h-1 bg-on-surface rounded-r"></div>
</div>
</div>
</div>
<!-- Main Canvas Content -->
<main class="px-6 pt-10 pb-8 flex flex-col">
<!-- Brand Kicker -->
<div class="mb-3">
<span class="font-label-caps text-label-caps uppercase tracking-wider text-slate-500 font-bold block">
            TC MUCKENSTURM
          </span>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-on-surface leading-tight mb-10 max-w-[15ch]">
          Willkommen zurück auf dem Platz.
        </h1>
<!-- Form Elements -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- E-Mail Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps uppercase tracking-wider text-slate-500 font-bold block" for="email">
              E-MAIL
            </label>
<div class="relative">
<input autocomplete="email" class="w-full h-12 px-4 rounded-2xl bg-slate-50 border border-slate-200 text-on-surface placeholder:text-outline-variant font-body-lg text-body-lg focus:outline-none focus:ring-0 focus:border-primary-container focus:bg-white transition-all duration-150" id="email" name="email" placeholder="deine.adresse@beispiel.de" type="email"/>
</div>
</div>
<!-- Passwort Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps uppercase tracking-wider text-slate-500 font-bold block" for="password">
              PASSWORT
            </label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-4 pr-24 rounded-2xl bg-slate-50 border border-slate-200 text-on-surface placeholder:text-outline-variant font-body-lg text-body-lg focus:outline-none focus:ring-0 focus:border-primary-container focus:bg-white transition-all duration-150" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-primary-container font-headline-sm text-sm font-semibold tracking-tight active:opacity-75 transition-opacity" id="togglePassword" type="button">
                Anzeigen
              </button>
</div>
</div>
<!-- Passwort vergessen? -->
<div class="flex justify-end pt-0.5">
<a class="text-primary-container font-body-sm text-body-sm font-semibold hover:underline" href="#">
              Passwort vergessen?
            </a>
</div>
<!-- Action Button: 48px Height, Pill Shape, Club Blue #1466A8 -->
<div class="pt-4">
<button class="w-full h-12 rounded-full bg-primary-container text-white font-headline-sm text-headline-sm font-semibold flex items-center justify-center tracking-tight active:scale-98 hover:opacity-95 transition-all duration-150" type="submit">
              Anmelden
            </button>
</div>
<!-- Membership CTA -->
<div class="text-center pt-5">
<p class="font-body-sm text-body-sm text-slate-500">
              Noch kein Mitglied? 
              <a class="text-primary-container font-semibold hover:underline ml-1" href="#">
                Antrag stellen
              </a>
</p>
</div>
</form>
</main>

<footer class="w-full px-6 pb-2 pt-6 flex flex-col items-center">
<div class="mb-4">
<p class="font-body-sm text-xs text-slate-400 tracking-tight select-none">

<span class="mx-1.5 opacity-60">·</span>
<a class="hover:text-slate-600 transition-colors" href="#">Impressum</a>
</p>
</div>
<!-- iOS Home Indicator Bar -->
<div class="w-32 h-1 bg-on-surface/20 rounded-full mb-1"></div>
</footer>

<!-- Micro-Interactions (Show/Hide Password toggle) -->
<script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');

    if (toggleButton && passwordInput) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleButton.textContent = isPassword ? 'Verbergen' : 'Anzeigen';
      });
    }
  </script>
