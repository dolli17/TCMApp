<!DOCTYPE html><html lang="de"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TC Muckensturm - Mannschaft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            club: {
              DEFAULT: '#1466A8',
              hover: '#0f5288',
              light: '#E8F1F8',
            },
            danger: {
              DEFAULT: '#C4433A',
            },
            ink: {
              DEFAULT: '#0A1624',
            }
          },
          fontFamily: {
            title: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"DM Sans"', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: #0A1624;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
      width: 393px;
      min-height: 852px;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    .font-title {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-white text-ink flex flex-col justify-between min-h-[852px] mx-auto">
  <div>
    <!-- iOS Status Bar (9:41) -->
    <div class="w-full pt-3 px-7 flex justify-between items-center text-xs font-semibold select-none text-ink">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <!-- Cellular Signal -->
        <svg class="w-4 h-3 text-ink fill-current" viewBox="0 0 17 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"></rect>
          <rect x="4.5" y="6" width="3" height="6" rx="0.5"></rect>
          <rect x="9" y="3" width="3" height="9" rx="0.5"></rect>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5"></rect>
        </svg>
        <!-- Wifi -->
        <svg class="w-3.5 h-3 text-ink fill-current" viewBox="0 0 16 12">
          <path d="M8 9.5C6.9 9.5 6 10.4 6 11.5C6 11.8 6.2 12 6.5 12C6.8 12 7 11.8 7 11.5C7 10.9 7.4 10.5 8 10.5C8.6 10.5 9 10.9 9 11.5C9 11.8 9.2 12 9.5 12C9.8 12 10 11.8 10 11.5C10 10.4 9.1 9.5 8 9.5ZM8 6C5.2 6 2.8 7.2 1.2 9.1C0.9 9.4 0.9 9.9 1.3 10.2C1.6 10.5 2.1 10.4 2.4 10.1C3.7 8.5 5.8 7.5 8 7.5C10.2 7.5 12.3 8.5 13.6 10.1C13.9 10.4 14.4 10.5 14.7 10.2C15.1 9.9 15.1 9.4 14.8 9.1C13.2 7.2 10.8 6 8 6ZM8 2C3.8 2 0.3 3.9 0 4.1C-0.1 4.4 0 4.8 0.3 5C0.6 5.2 1 5.1 1.2 4.8C1.5 4.6 4.6 3 8 3C11.4 3 14.5 4.6 14.8 4.8C15 5.1 15.4 5.2 15.7 5C16 4.8 16.1 4.4 16 4.1C15.7 3.9 12.2 2 8 2Z"></path>
        </svg>
        <!-- Battery -->
        <div class="w-6 h-3 border border-ink/80 rounded-[3px] p-[1px] flex items-center">
          <div class="h-full w-4 bg-ink rounded-[1.5px]"></div>
        </div>
      </div>
    </div>

    <!-- Header & Navigation -->
    <header class="px-5 pt-3 pb-6">
      <a href="#" class="inline-flex items-center gap-1 text-club font-semibold font-title text-sm hover:opacity-80 transition-opacity"><svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg><span>Konto</span></a>
      <h1 class="text-2xl font-bold font-title text-ink mt-3 tracking-tight">Mannschaft</h1>
    </header>

    <!-- Main Content -->
    <main class="px-5 space-y-7">

      <!-- Abschnitt 1: Einladungen -->
      <section class="space-y-3">
        <h2 class="text-lg font-semibold font-title text-ink tracking-tight">Einladungen</h2>
        
        <!-- Hellblaue Karte (#E8F1F8) -->
        <div class="bg-club-light rounded-2xl p-4 space-y-3.5">
          <div>
            <p class="text-base font-medium text-ink leading-snug">
              Martin Keller lädt dich in die Mannschaft <span class="font-semibold">Mixed 40</span> ein.
            </p>
            <p class="text-xs text-slate-500 mt-1">
              verfällt in 5 Tagen
            </p>
          </div>

          <!-- Buttons nebeneinander -->
          <div class="grid grid-cols-2 gap-2.5 pt-0.5"><button class="w-full h-[52px] px-4 rounded-full bg-club text-white text-sm font-semibold font-title tracking-tight hover:bg-club-hover active:scale-[0.98] transition-all flex items-center justify-center text-center">Annehmen</button><button class="w-full h-[52px] px-4 rounded-full bg-white text-[#0F172A] border border-[#E2E8F0] text-sm font-semibold font-title tracking-tight hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center text-center">Ablehnen</button></div>

          <!-- Kleiner Hinweis -->
          <p class="text-xs text-slate-500 pt-0.5 leading-relaxed">
            Mit der Annahme verlässt du Damen 40.
          </p>
        </div>
      </section>

      <!-- Abschnitt 2: Kader Damen 40 -->
      <section class="space-y-3">
        <h2 class="text-lg font-semibold font-title text-ink tracking-tight">Kader Damen 40</h2>

        <!-- Listenkarte mit Haarlinien -->
        <div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-200 overflow-hidden shadow-none"><div class="flex items-center justify-between p-3.5"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-club-light text-club flex items-center justify-center text-xs font-semibold font-title flex-shrink-0">SR</div><div><div class="flex items-center gap-2"><span class="text-sm font-medium text-ink">Sabine Roth</span><span class="px-2 py-0.5 text-[11px] font-semibold font-title text-club bg-club-light rounded-full leading-tight">Mannschaftsführer</span></div></div></div><div class="text-xs font-semibold text-slate-500 font-title">LK 12,8</div></div><div class="flex items-center justify-between p-3.5"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-club-light text-club flex items-center justify-center text-xs font-semibold font-title flex-shrink-0">AB</div><div class="flex items-center gap-1.5"><span class="text-sm font-medium text-ink">Anna Berger</span><span class="text-xs font-semibold font-title px-1.5 py-0.2 rounded text-[#0F172A] bg-[#FFD21F]">du</span></div></div><div class="text-xs font-semibold text-slate-500 font-title">LK 14,2</div></div><div class="flex items-center justify-between p-3.5"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-club-light text-club flex items-center justify-center text-xs font-semibold font-title flex-shrink-0">PL</div><div><span class="text-sm font-medium text-ink">Petra Lang</span></div></div><div class="text-xs font-normal text-slate-500 font-title">ohne LK</div></div><div class="flex items-center justify-between p-3.5"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-club-light text-club flex items-center justify-center text-xs font-semibold font-title flex-shrink-0">CW</div><div><span class="text-sm font-medium text-ink">Claudia Wirth</span></div></div><div class="text-xs font-semibold text-slate-500 font-title">LK 16,1</div></div></div>
      </section>

    </main>
  </div>

  <!-- Footer / Bottom Area mit ruhigem roten Textbutton -->
  <footer class="px-5 pt-8 pb-10 flex flex-col items-center">
    <button class="text-sm font-semibold font-title text-[#C4433A] hover:opacity-80 active:opacity-60 transition-opacity">Aus Mannschaft austreten</button>
    <!-- Home Bar Indicator -->
    <div class="w-32 h-1 bg-slate-200 rounded-full mt-6"></div>
  </footer>




</body></html>
