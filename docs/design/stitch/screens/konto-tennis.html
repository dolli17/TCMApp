    body {
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;

<body class="bg-slate-100 flex justify-center min-h-screen text-[#0A1624]">
<!-- iPhone Canvas Container: 393px × 852px -->
<main class="w-full max-w-[393px] h-[852px] bg-white relative flex flex-col overflow-hidden shadow-2xl">
<!-- 1. iOS Status Bar -->
<header class="w-full h-[44px] pt-3 px-7 flex items-center justify-between shrink-0 bg-white z-20 select-none">
<span class="font-['Space_Grotesk'] text-[15px] font-semibold tracking-tight text-[#0A1624]">9:41</span>
<div class="flex items-center space-x-1.5 text-[#0A1624]">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="11.5" rx="0.5" width="2.5" x="12" y="0.5"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M8 11.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-4.24-4.24a6 6 0 0 1 8.48 0 .75.75 0 0 0 1.06-1.06 7.5 7.5 0 0 0-10.6 0 .75.75 0 0 0 1.06 1.06zm-2.12-2.12a9 9 0 0 1 12.72 0 .75.75 0 1 0 1.06-1.06 10.5 10.5 0 0 0-14.84 0 .75.75 0 1 0 1.06 1.06z"></path>
</svg>
<!-- Battery -->
<div class="flex items-center">
<div class="w-5 h-2.5 rounded-sm border border-[#0A1624] p-0.5 flex items-center">
<div class="w-full h-full bg-[#0A1624] rounded-2xs"></div>
</div>
<div class="w-0.5 h-1 bg-[#0A1624] rounded-r-xs ml-0.5"></div>
</div>
</div>
</header>
<!-- Scrollable Content Canvas -->
<div class="flex-1 overflow-y-auto px-5 pt-1 pb-32">
<!-- 2. Navigation / Header (Zurück-Link nach Konto) -->
<nav class="pt-1">
<a class="inline-flex items-center gap-0.5 text-[#1466A8] font-semibold text-[14px] cursor-pointer active:opacity-70 transition-opacity -ml-1 font-['Space_Grotesk']" href="#konto"><span class="material-symbols-outlined text-[20px] font-semibold">chevron_left</span><span>Konto</span></a>
<div class="mt-4 mb-1">
<h1 class="font-['Space_Grotesk'] text-[24px] font-bold text-[#0A1624] tracking-tight">Tennis</h1>
</div>
<p class="font-['DM_Sans'] text-[14px] text-slate-500 leading-snug">
          Die LK bestimmt, welche Mitspielersuchen du siehst.
        </p>
</nav>
<!-- 3. Karte „Aktuelle LK“ -->
<section class="rounded-2xl border border-slate-200 bg-white p-5 mt-6">
<span class="font-['Space_Grotesk'] text-[11px] font-bold uppercase tracking-wider text-slate-400 block">
          AKTUELL
        </span>
<div class="font-['Space_Grotesk'] text-[44px] font-bold text-[#0A1624] tracking-tight leading-none mt-2">
          LK 14,2
        </div>
</section>
<!-- 4. Eingabefelder (LK und NULIGA-ID) -->
<section class="grid grid-cols-2 gap-3 mt-4">
<!-- Feld LK -->
<div class="flex flex-col">
<label class="font-['Space_Grotesk'] text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 ml-1" for="input-lk">
            LK
          </label>
<input class="w-full h-[52px] rounded-full border border-[#E2E8F0] bg-[#F8FAFC] px-5 text-[16px] font-['Space_Grotesk'] font-medium text-[#0A1624] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-all shadow-none" id="input-lk" type="text" value="14,2">
</div>
<!-- Feld NULIGA-ID -->
<div class="flex flex-col">
<label class="font-['Space_Grotesk'] text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 ml-1" for="input-nuliga">
            NULIGA-ID
          </label>
<input class="w-full h-[52px] rounded-full border border-[#E2E8F0] bg-[#F8FAFC] px-5 text-[16px] font-['Space_Grotesk'] font-medium text-[#0A1624] focus:outline-none focus:border-[#1466A8] focus:bg-white transition-all shadow-none" id="input-nuliga" type="text" value="12345678">
</div>
</section>
<!-- 5. Schalterzeile: Interesse an Mannschaft (Zustand: AUS) -->
<section class="mt-6 pt-2">
<label class="flex items-center justify-between cursor-pointer select-none py-1">
<span class="text-[15px] font-medium text-[#0A1624] pr-4">
            Ich habe Interesse an einer Mannschaft
          </span>
<div class="relative shrink-0">
<input class="sr-only peer" id="toggle-interest" type="checkbox">
<!-- iOS Toggle Track (OFF: bg-slate-200, ON: peer-checked:bg-[#1466A8]) -->
<div class="w-[51px] h-[31px] bg-[#E2E8F0] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-[20px] peer-checked:bg-[#1466A8] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-200 after:rounded-full after:h-[27px] after:w-[27px] after:transition-all after:shadow-sm"></div>
</div>
</label>
</section>
<!-- 6. Karte „Mannschaft: Damen 40“ -->
<section class="rounded-2xl border border-slate-200 bg-white p-5 mt-5">
<!-- Kopfzeile -->
<div class="flex items-center justify-between pb-4 border-b border-slate-100">
<h2 class="font-['Space_Grotesk'] text-[16px] font-bold text-[#0A1624] tracking-tight">
            Mannschaft: Damen 40
          </h2>
<a class="text-[14px] font-semibold text-[#1466A8] hover:underline cursor-pointer font-['Space_Grotesk']" href="#damen40">
            Zur Mannschaft
          </a>
</div>
<!-- Schalterzeile darunter (Zustand: EIN) -->
<div class="pt-4">
<label class="flex items-center justify-between cursor-pointer select-none">
<span class="text-[14px] font-normal text-[#0A1624] pr-4 leading-snug">
              Mannschaftsführer darf meine Telefonnummer sehen
            </span>
<div class="relative shrink-0">
<input checked="" class="sr-only peer" id="toggle-phone" type="checkbox">
<!-- iOS Toggle Track (ON by default) -->
<div class="w-[51px] h-[31px] bg-[#E2E8F0] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-[20px] peer-checked:bg-[#1466A8] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[27px] after:w-[27px] after:transition-all after:shadow-sm"></div>
</div>
</label>
</div>
</section>
</div>
<!-- 7. Fester Fußbereich (Sticky / Fixed Bottom) -->
<footer class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 pt-4 pb-6 px-5 z-30">
<button class="w-full h-[56px] rounded-full bg-[#1466A8] text-white font-['Space_Grotesk'] font-semibold text-[16px] flex items-center justify-center shadow-none hover:bg-[#0f4f82] active:scale-[0.99] transition-all cursor-pointer" type="button">
        Speichern
      </button>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center mt-4">
<div class="w-32 h-1 bg-slate-900/80 rounded-full"></div>
</div>
</footer>
</main>
<script>
    // Micro-interaction for form save feedback
    document.querySelector('button').addEventListener('click', function() {
      const originalText = this.textContent;
      this.textContent = 'Gespeichert';
      this.classList.add('bg-slate-800');
      setTimeout(() => {
        this.textContent = originalText;
        this.classList.remove('bg-slate-800');
      }, 1400);
    });
  </script>
