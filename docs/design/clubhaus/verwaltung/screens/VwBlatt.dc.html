<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Verwaltung – Serie anlegen (Blatt)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Semi+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Barlow', system-ui, sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 1060px">
<dc-import name="VwSerien" modus="{{modus}}" hint-size="390px,1060px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(3,8,14,.62)"></div>

<form role="dialog" aria-modal="true" aria-labelledby="blatt-titel" style="position: absolute; left: 0; right: 0; bottom: 0; height: 772px; box-sizing: border-box; border-radius: 30px 30px 0 0; background: {{t.surf}}; border-top: 1px solid {{t.line}}; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -20px 60px rgba(0,0,0,.4)">
<div style="width: 38px; height: 5px; border-radius: 3px; background: {{t.line2}}; align-self: center"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 id="blatt-titel" style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.3px">Serie anlegen</h2>
<a href="VwSerien.dc.html" aria-label="Schließen" style="width: 40px; height: 40px; border-radius: 20px; background: {{t.surf2}}; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>

<div style="border-radius: 18px; background: {{t.surf2}}; overflow: hidden">
<label style="display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; border-bottom: 1px solid {{t.line}}">
<span style="width: 70px; font-size: 15px; font-weight: 600; color: {{t.ink2}}">Titel</span>
<input type="text" placeholder="z. B. Training Herren" style="flex-grow: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: {{t.ink}}">
</label>
<button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; border: 0; background: transparent; font-family: 'Barlow', sans-serif; text-align: left; color: {{t.ink}}">
<span style="width: 70px; font-size: 15px; font-weight: 600; color: {{t.ink2}}">Art</span>
<span style="flex-grow: 1; font-size: 16px">[Art]</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</div>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: {{t.ink2}}">Wochentag</legend>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{tage}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.an}}" style="height: 44px; border-radius: 14px; font-family: 'Barlow', sans-serif; font-size: 13.5px; font-weight: 700; {{d.stil}}">{{d.l}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 60px; border: 0; border-radius: 16px; background: {{t.surf2}}; color: {{t.ink}}; text-align: left; padding: 0 16px; font-family: 'Barlow', sans-serif"><span style="display: block; font-size: 12.5px; font-weight: 600; color: {{t.muted}}">Von</span><span style="display: block; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 22px; font-weight: 700">18:00</span></button>
<button type="button" style="height: 60px; border: 0; border-radius: 16px; background: {{t.surf2}}; color: {{t.ink}}; text-align: left; padding: 0 16px; font-family: 'Barlow', sans-serif"><span style="display: block; font-size: 12.5px; font-weight: 600; color: {{t.muted}}">Bis</span><span style="display: block; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 22px; font-weight: 700">20:00</span></button>
</div>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: {{t.ink2}}">Plätze</legend>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{plaetze}}" as="p" hint-placeholder-count="8">
<button type="button" aria-pressed="{{p.an}}" aria-label="{{p.aria}}" style="height: 44px; border-radius: 14px; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 18px; font-weight: 700; {{p.stil}}">{{p.l}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 56px; border: 0; border-radius: 16px; background: {{t.surf2}}; color: {{t.ink}}; text-align: left; padding: 0 16px; font-family: 'Barlow', sans-serif"><span style="display: block; font-size: 12.5px; font-weight: 600; color: {{t.muted}}">Ab</span><span style="display: block; font-size: 16px; font-weight: 700">[Datum]</span></button>
<button type="button" style="height: 56px; border: 0; border-radius: 16px; background: {{t.surf2}}; color: {{t.ink}}; text-align: left; padding: 0 16px; font-family: 'Barlow', sans-serif"><span style="display: block; font-size: 12.5px; font-weight: 600; color: {{t.muted}}">Bis</span><span style="display: block; font-size: 16px; font-weight: 700">[Datum]</span></button>
</div>

<div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; background: {{t.goldSoft}}; border: 1.5px dashed {{t.goldLine}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.goldInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3 2 21h20zM12 10v5M12 18h0"></path></svg>
<div style="font-size: 14px; line-height: 1.4"><b>[n] Buchungen liegen im Weg.</b> Sie werden abgesagt, die Mitglieder bekommen Bescheid.</div>
</div>

<div style="margin-top: auto">
<button type="submit" style="width: 100%; height: 58px; border: 0; border-radius: 18px; background: {{t.gold}}; color: {{t.onGold}}; font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 800; box-shadow: 0 10px 28px rgba(255,210,31,.3)">Serie anlegen · [n] Termine</button>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modus":{"editor":"enum","options":["dunkel","hell"],"default":"dunkel"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var T = {
dunkel: { bg: '#07111D', surf: '#0E1A29', surf2: '#152538', line: 'rgba(255,255,255,.08)', line2: 'rgba(255,255,255,.18)', ink: '#F3F7FB', ink2: '#B3C2D2', muted: '#879AAE', gold: '#FFD21F', goldSoft: 'rgba(255,210,31,.12)', goldLine: '#FFD21F', goldInk: '#FFD21F', onGold: '#0A1624', an: 'border: 0; background: #F3F7FB; color: #07111D', aus: 'border: 0; background: #152538; color: #B3C2D2' },
hell: { bg: '#F3F5F8', surf: '#FFFFFF', surf2: '#EEF2F6', line: '#E3E8EE', line2: '#CBD5E0', ink: '#0A1624', ink2: '#44566B', muted: '#596A7D', gold: '#FFD21F', goldSoft: '#FFF6D1', goldLine: '#E0B400', goldInk: '#7A5C00', onGold: '#0A1624', an: 'border: 0; background: #0A1624; color: #FFFFFF', aus: 'border: 0; background: #EEF2F6; color: #44566B' }
};
var modus = this.props.modus || 'dunkel';
var t = T[modus] || T.dunkel;
return {
t: t,
modus: modus,
tage: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(function (d) { var an = d === 'Di'; return { l: d, an: an ? 'true' : 'false', stil: an ? t.an : t.aus }; }),
plaetze: [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { var an = n === 2 || n === 3; return { l: String(n), aria: 'Platz ' + n, an: an ? 'true' : 'false', stil: an ? t.an : t.aus }; })
};
}
}
</script>
</body>
</html>
