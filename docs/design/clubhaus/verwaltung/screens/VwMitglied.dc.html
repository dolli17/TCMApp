<sc-for list="{{gruppen}}" as="g" hint-placeholder-count="4">

<div style="display: flex; justify-content: space-between; margin-top: 12px"><span style="font-size: 13.5px; color: {{t.muted}}">Letzter Eintrag [Datum]</span><span style="font-size: 14px; font-weight: 700; color: {{t.blue}}">Stunden eintragen</span></div>
