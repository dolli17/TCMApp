<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Verwaltung – Plätze und Serien (Telefon)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Semi+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1060px; position: relative; overflow: hidden; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Barlow', system-ui, sans-serif">

<div style="padding: 56px 20px 0">
<a href="VwUebersicht.dc.html" style="display: inline-flex; align-items: center; gap: 2px; min-height: 32px; font-size: 15px; font-weight: 600; color: {{t.blue}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Verwaltung</a>
<div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.6px; line-height: 1.05">Plätze &amp; Serien</h1>
<a href="VwBlatt.dc.html" style="height: 40px; padding: 0 14px 0 10px; border-radius: 20px; background: {{t.gold}}; color: {{t.onGold}}; font-size: 14.5px; font-weight: 800; display: flex; align-items: center; gap: 4px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Serie</a>
</div>
</div>

<div style="margin: 16px 20px 0; padding: 4px; border-radius: 16px; background: {{t.surf2}}; display: flex; gap: 4px">
<a href="#" style="flex-grow: 1; flex-basis: 0; height: 40px; border-radius: 12px; color: {{t.muted}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Plätze</a>
<a href="VwSerien.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; height: 40px; border-radius: 12px; background: {{t.segAktiv}}; color: {{t.ink}}; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: {{t.karte}}">Serien</a>
</div>

<div style="padding: 24px 20px 0; display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.2px">Laufend</h2>
<span style="font-size: 14px; color: {{t.muted}}">[n] Serien</span>
</div>
<ul style="list-style: none; margin: 12px 20px 0; padding: 0; border-radius: 22px; background: {{t.surf}}; border: 1px solid {{t.line}}; box-shadow: {{t.karte}}; overflow: hidden">
<sc-for list="{{serien}}" as="s" hint-placeholder-count="4">
<li style="border-bottom: 1px solid {{t.line}}">
<a href="#" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 16px; min-height: 72px; box-sizing: border-box; color: {{t.ink}}; text-decoration: none">
<span style="width: 48px; height: 52px; border-radius: 14px; flex-shrink: 0; background: {{t.hatch}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 800; font-size: 17px; color: {{t.ink}}">{{s.tag}}</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 16px; font-weight: 700">{{s.titel}}</span>
<span style="display: block; font-size: 13.5px; color: {{t.ink2}}; margin-top: 2px; font-variant-numeric: tabular-nums">{{s.zeit}}</span>
<span style="display: block; font-size: 13px; color: {{t.muted}}; margin-top: 1px">{{s.info}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</li>
</sc-for>
</ul>

<div style="margin: 12px 20px 0; border-radius: 22px; background: {{t.surf}}; border: 1px solid {{t.line}}; box-shadow: {{t.karte}}; overflow: hidden">
<a href="#" style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; min-height: 52px; color: {{t.ink}}; text-decoration: none"><span style="font-size: 15.5px; font-weight: 600">Beendete Serien</span><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: {{t.muted}}">[n]<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a>
</div>

<nav aria-label="Hauptmenü" style="position: absolute; left: 16px; right: 92px; bottom: 26px; height: 64px; border-radius: 32px; background: {{t.glass}}; border: 1px solid {{t.glassLine}}; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: {{t.schwebend}}; display: flex; align-items: center; padding: 0 5px; gap: 1px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<a href="{{tab.href}}" style="flex-grow: 1; flex-basis: 0; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 10.5px; font-weight: 600; background: {{tab.bg}}; color: {{tab.color}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg>{{tab.label}}</a>
</sc-for>
</nav>
<a href="#" aria-label="Platz buchen" style="position: absolute; right: 16px; bottom: 26px; width: 64px; height: 64px; border-radius: 32px; background: {{t.gold}}; color: {{t.onGold}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 28px rgba(255,210,31,.35)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modus":{"editor":"enum","options":["dunkel","hell"],"default":"dunkel"},"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
renderVals() {
var T = {
dunkel: { bg: '#07111D', surf: '#0E1A29', surf2: '#152538', segAktiv: '#1E3249', line: 'rgba(255,255,255,.08)', ink: '#F3F7FB', ink2: '#B3C2D2', muted: '#879AAE', blue: '#3A9BE0', gold: '#FFD21F', onGold: '#0A1624', glass: 'rgba(22,36,54,.78)', glassLine: 'rgba(255,255,255,.12)', tabAktiv: 'rgba(255,210,31,.14)', tabAktivInk: '#FFD21F', schwebend: '0 16px 40px rgba(0,0,0,.5)', karte: 'none', hatch: 'repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 4px, transparent 4px 8px), #1E3249' },
hell: { bg: '#F3F5F8', surf: '#FFFFFF', surf2: '#EEF2F6', segAktiv: '#FFFFFF', line: '#E3E8EE', ink: '#0A1624', ink2: '#44566B', muted: '#596A7D', blue: '#1A6FB0', gold: '#FFD21F', onGold: '#0A1624', glass: 'rgba(255,255,255,.82)', glassLine: 'rgba(10,22,36,.08)', tabAktiv: '#FFD21F', tabAktivInk: '#0A1624', schwebend: '0 16px 40px rgba(10,22,36,.16)', karte: '0 1px 2px rgba(10,22,36,.05), 0 6px 20px rgba(10,22,36,.06)', hatch: 'repeating-linear-gradient(135deg, rgba(10,22,36,.08) 0 4px, transparent 4px 8px), #E2E8EF' }
};
var t = T[this.props.modus] || T.dunkel;
var I = {
home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
platz: 'M4 4h16v16H4zM4 12h16M8 8h8v8H8zM12 8v8',
getraenk: 'M6 3h12l-1.5 5.5a5 5 0 0 1-9 0zM12 14v7M8 21h8',
konto: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
admin: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'
};
var tabs = [['Home', 'home', '#'], ['Plätze', 'platz', '#'], ['Getränke', 'getraenk', '#'], ['Konto', 'konto', '#'], ['Admin', 'admin', 'VwUebersicht.dc.html']].map(function (x, i) {
return { label: x[0], d: I[x[1]], href: x[2], bg: i === 4 ? t.tabAktiv : 'transparent', color: i === 4 ? t.tabAktivInk : t.muted };
});
return {
t: t,
tabs: tabs,
serien: [
{ tag: 'MO', titel: '[Titel]', zeit: 'Montag · 16:00 – 19:00', info: '[Art] · Platz 2 · bis [Datum]' },
{ tag: 'DI', titel: '[Titel]', zeit: 'Dienstag · 18:00 – 20:00', info: '[Art] · Platz 2, 3 · bis [Datum]' },
{ tag: 'MI', titel: '[Titel]', zeit: 'Mittwoch · 17:00 – 19:00', info: '[Art] · Platz 5 · bis [Datum]' },
{ tag: 'SA', titel: '[Titel]', zeit: 'Samstag · 09:00 – 14:00', info: '[Art] · Platz 1–4 · bis [Datum]' }
]
};
}
}
</script>
</body>
</html>
