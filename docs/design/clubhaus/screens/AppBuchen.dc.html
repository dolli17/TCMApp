<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App – Platz buchen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Semi+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Barlow', system-ui, sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 1260px">
<dc-import name="AppPlaetze" modus="{{modus}}" hint-size="390px,1260px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(3,8,14,.62)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="buchen-titel" style="position: absolute; left: 0; right: 0; bottom: 0; height: 680px; box-sizing: border-box; border-radius: 30px 30px 0 0; background: {{t.surf}}; border-top: 1px solid {{t.line}}; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -20px 60px rgba(0,0,0,.4)">
<div style="width: 38px; height: 5px; border-radius: 3px; background: {{t.line2}}; align-self: center"></div>

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div>
<div style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: {{t.muted}}">Platz 6 · Montag, 28.09.</div>
<h2 id="buchen-titel" style="margin: 4px 0 0; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">17:00 – 18:00</h2>
</div>
<a href="AppPlaetze.dc.html" aria-label="Schließen" style="width: 40px; height: 40px; border-radius: 20px; background: {{t.surf2}}; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<fieldset style="border: 0; margin: 0; padding: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: {{t.ink2}}">Beginn</legend>
<div style="padding: 4px; border-radius: 14px; background: {{t.surf2}}; display: flex; gap: 4px">
<button type="button" aria-pressed="true" style="flex-grow: 1; flex-basis: 0; height: 40px; border: 0; border-radius: 10px; background: {{t.segActive}}; color: {{t.ink}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; box-shadow: {{t.cardShadow}}">17:00</button>
<button type="button" aria-pressed="false" style="flex-grow: 1; flex-basis: 0; height: 40px; border: 0; border-radius: 10px; background: transparent; color: {{t.muted}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600">17:30</button>
</div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: {{t.ink2}}">Spielform</legend>
<div style="padding: 4px; border-radius: 14px; background: {{t.surf2}}; display: flex; gap: 4px">
<button type="button" aria-pressed="true" style="flex-grow: 1; flex-basis: 0; height: 40px; border: 0; border-radius: 10px; background: {{t.segActive}}; color: {{t.ink}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; box-shadow: {{t.cardShadow}}">Einzel</button>
<button type="button" aria-pressed="false" style="flex-grow: 1; flex-basis: 0; height: 40px; border: 0; border-radius: 10px; background: transparent; color: {{t.muted}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600">Doppel</button>
</div>
</fieldset>
</div>

<div>
<div style="margin-bottom: 8px; font-size: 13px; font-weight: 600; color: {{t.ink2}}">Wer spielt mit?</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="height: 40px; padding: 0 14px 0 4px; border-radius: 20px; background: {{t.surf2}}; display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600"><span style="width: 32px; height: 32px; border-radius: 16px; background: {{t.yellow}}; color: {{t.onYellow}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">LD</span>Du</span>
<span style="height: 40px; padding: 0 4px 0 4px; border-radius: 20px; background: {{t.surf2}}; display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600"><span style="width: 32px; height: 32px; border-radius: 16px; background: #1466A8; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">[M]</span>[Mitspieler]<button type="button" aria-label="[Mitspieler] entfernen" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
</div>
<div style="display: flex; gap: 8px; margin-top: 10px">
<button type="button" style="flex-grow: 1; flex-basis: 0; height: 46px; box-sizing: border-box; border-radius: 14px; border: 1.5px dashed {{t.line2}}; background: transparent; color: {{t.ink}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Mitglied</button>
<button type="button" style="flex-grow: 1; flex-basis: 0; height: 46px; box-sizing: border-box; border-radius: 14px; border: 1.5px dashed {{t.line2}}; background: transparent; color: {{t.ink}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Gast · [Gebühr]</button>
</div>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: {{t.surf2}}">
<div style="flex-grow: 1">
<div id="gesucht-titel" style="font-size: 16px; font-weight: 700">Mitspieler gesucht</div>
<div style="font-size: 13px; line-height: 1.4; color: {{t.muted}}; margin-top: 2px">Dein Spiel erscheint unter „Offene Spiele“. Wer mag, trägt sich selbst ein.</div>
</div>
<button type="button" role="switch" aria-checked="false" aria-labelledby="gesucht-titel" style="width: 52px; height: 32px; flex-shrink: 0; border: 0; padding: 3px; border-radius: 16px; background: {{t.surf3}}; box-shadow: inset 0 0 0 1.5px {{t.line2}}; display: flex; justify-content: flex-start"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.3)"></span></button>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="AppHome.dc.html" style="height: 58px; border-radius: 18px; background: {{t.yellow}}; color: {{t.onYellow}}; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 10px 28px rgba(255,210,31,.3)">Platz 6 buchen</a>
<div style="text-align: center; font-size: 12.5px; color: {{t.muted}}">Stornieren geht bis Spielbeginn</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modus":{"editor":"enum","options":["dunkel","hell"],"default":"dunkel"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var T = {
dunkel: { bg: '#07111D', surf: '#0E1A29', surf2: '#152538', surf3: '#1E3249', segActive: '#1E3249', line: 'rgba(255,255,255,.08)', line2: 'rgba(255,255,255,.18)', ink: '#F3F7FB', ink2: '#B3C2D2', muted: '#8497AC', yellow: '#FFD21F', onYellow: '#0A1624', cardShadow: 'none' },
hell: { bg: '#F3F5F8', surf: '#FFFFFF', surf2: '#EEF2F6', surf3: '#E2E8EF', segActive: '#FFFFFF', line: '#E3E8EE', line2: '#C3CEDA', ink: '#0A1624', ink2: '#44566B', muted: '#5F7185', yellow: '#FFD21F', onYellow: '#0A1624', cardShadow: '0 1px 3px rgba(10,22,36,.10)' }
};
var modus = this.props.modus || 'dunkel';
return { t: T[modus] || T.dunkel, modus: modus };
}
}
</script>
</body>
</html>
