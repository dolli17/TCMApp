<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Verwaltung – Mitglieder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Semi+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 960px; display: flex; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Barlow', system-ui, sans-serif">

<aside style="width: 264px; flex-shrink: 0; box-sizing: border-box; background: {{t.side}}; border-right: 1px solid {{t.line}}; padding: 28px 16px 20px; display: flex; flex-direction: column">
<img src="{{t.logo}}" alt="TC Muckensturm" style="height: 34px; width: auto; align-self: flex-start; margin: 0 10px 24px">
<a href="WebPlan.dc.html" style="height: 46px; border-radius: 14px; background: {{t.yellow}}; color: {{t.onYellow}}; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-bottom: 18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Platz buchen</a>
<nav aria-label="Hauptmenü" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 15px; font-weight: 600; {{n.stil}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>
<div style="margin: 22px 12px 8px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: {{t.muted}}">Verwaltung</div>
<nav aria-label="Verwaltung" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{admin}}" as="n" hint-placeholder-count="6">
<a href="{{n.href}}" style="height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14.5px; font-weight: 600; {{n.stil}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: {{t.surf2}}">
<span style="width: 38px; height: 38px; border-radius: 19px; background: #1466A8; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">LD</span>
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 14px; font-weight: 700">Lucas Dollmann</div><div style="font-size: 12px; color: {{t.muted}}">Admin</div></div>
</div>
</aside>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div>
<div style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: {{t.muted}}">Verwaltung</div>
<h1 style="margin: 4px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -.9px; line-height: 1.05">Mitglieder</h1>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="height: 46px; padding: 0 18px; border-radius: 14px; border: 1px solid {{t.line2}}; background: {{t.surf}}; color: {{t.ink}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600">Export</button>
<button type="button" style="height: 46px; padding: 0 20px; border: 0; border-radius: 14px; background: {{t.yellow}}; color: {{t.onYellow}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Mitglied anlegen</button>
</div>
</div>

<nav aria-label="Bereiche Mitglieder" style="display: flex; gap: 6px; border-bottom: 1px solid {{t.line}}">
<sc-for list="{{reiter}}" as="r" hint-placeholder-count="5">
<a href="#" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 700; margin-bottom: -1px; {{r.stil}}">{{r.name}}<sc-if value="{{r.zahl}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 7px; border-radius: 10px; background: {{t.yellow}}; color: {{t.onYellow}}; font-size: 12px; display: inline-flex; align-items: center">[n]</span></sc-if></a>
</sc-for>
</nav>

<div style="display: flex; gap: 12px; align-items: center">
<label style="flex-grow: 1; max-width: 420px; height: 46px; box-sizing: border-box; border-radius: 14px; background: {{t.surf}}; border: 1px solid {{t.line2}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
<input type="search" aria-label="Mitglieder durchsuchen" placeholder="Name, E-Mail, Mitgliedsnummer" style="border: 0; outline: 0; background: transparent; flex-grow: 1; font: inherit; font-size: 15px; color: {{t.ink}}">
</label>
<sc-for list="{{filter}}" as="f" hint-placeholder-count="5">
<button type="button" aria-pressed="{{f.aktiv}}" style="height: 38px; padding: 0 14px; border-radius: 19px; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 600; {{f.stil}}">{{f.name}}</button>
</sc-for>
</div>

<div style="border-radius: 22px; background: {{t.surf}}; border: 1px solid {{t.line}}; box-shadow: {{t.cardShadow}}; overflow: hidden">
<table style="width: 100%; border-collapse: collapse; font-size: 14.5px">
<thead>
<tr style="background: {{t.surf2}}">
<sc-for list="{{kopf}}" as="k" hint-placeholder-count="6">
<th scope="col" style="text-align: left; padding: 12px 18px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}; border-bottom: 1px solid {{t.line}}">{{k.l}}</th>
</sc-for>
</tr>
</thead>
<tbody>
<sc-for list="{{zeilen}}" as="z" hint-placeholder-count="8">
<tr style="border-bottom: 1px solid {{t.line}}">
<td style="padding: 12px 18px"><div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; border-radius: 18px; background: {{z.farbe}}; color: #FFFFFF; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{z.kurz}}</span><div><div style="font-weight: 700">{{z.name}}</div><div style="font-size: 12.5px; color: {{t.muted}}">{{z.mail}}</div></div></div></td>
<td style="padding: 12px 18px">{{z.art}}</td>
<td style="padding: 12px 18px; color: {{t.ink2}}">{{z.team}}</td>
<td style="padding: 12px 18px"><span style="height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; {{z.mandatStil}}">{{z.mandat}}</span></td>
<td style="padding: 12px 18px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 16px">{{z.offen}}</td>
<td style="padding: 12px 18px"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: {{t.ink2}}"><span style="width: 8px; height: 8px; border-radius: 4px; {{z.statusPunkt}}"></span>{{z.status}}</span></td>
</tr>
</sc-for>
</tbody>
</table>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; font-size: 13.5px; color: {{t.muted}}">
<span>[n] Mitglieder · 8 angezeigt</span>
<div style="display: flex; gap: 6px"><button type="button" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.line2}}; background: {{t.surf}}; color: {{t.ink}}; font-family: 'Barlow', sans-serif; font-weight: 600">Zurück</button><button type="button" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.line2}}; background: {{t.surf}}; color: {{t.ink}}; font-family: 'Barlow', sans-serif; font-weight: 600">Weiter</button></div>
</div>
</div>
</main>
</div>
</x-dc>
