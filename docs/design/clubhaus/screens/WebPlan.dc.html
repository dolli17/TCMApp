<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Web – Belegungsplan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&amp;family=Barlow+Semi+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 980px; display: flex; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Barlow', system-ui, sans-serif">

<aside style="width: 264px; flex-shrink: 0; box-sizing: border-box; background: {{t.side}}; border-right: 1px solid {{t.line}}; padding: 28px 16px 20px; display: flex; flex-direction: column">

<a href="WebPlan.dc.html" style="height: 46px; border-radius: 14px; background: {{t.yellow}}; color: {{t.onYellow}}; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-bottom: 18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Platz buchen</a>
<nav aria-label="Hauptmenü" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 15px; font-weight: 600; {{n.stil}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>
<div style="margin: 22px 12px 8px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: {{t.muted}}">Verwaltung</div>
<nav aria-label="Verwaltung" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{admin}}" as="n" hint-placeholder-count="6">
<a href="{{n.href}}" style="height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14.5px; font-weight: 600; {{n.stil}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: {{t.surf2}}">
<span style="width: 38px; height: 38px; border-radius: 19px; background: #1466A8; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">LD</span>
<div style="flex-grow: 1; min-width: 0"><div style="font-size: 14px; font-weight: 700">Lucas Dollmann</div><div style="font-size: 12px; color: {{t.muted}}">Admin</div></div>
</div>
</aside>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div>
<div style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: {{t.muted}}">8 Sandplätze · 08 bis 21 Uhr</div>
<h1 style="margin: 4px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -.9px; line-height: 1.05">Belegungsplan</h1>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<sc-for list="{{tage}}" as="d" hint-placeholder-count="8">
<button type="button" aria-pressed="{{d.aktiv}}" style="width: 54px; height: 62px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: 'Barlow', sans-serif; {{d.stil}}"><span style="font-size: 10.5px; font-weight: 700; letter-spacing: .08em">{{d.wt}}</span><span style="font-family: 'Barlow Semi Condensed', sans-serif; font-size: 23px; font-weight: 700; line-height: 1">{{d.nr}}</span></button>
</sc-for>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; gap: 18px; flex-wrap: wrap">
<sc-for list="{{legende}}" as="l" hint-placeholder-count="5">
<span style="display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: {{t.ink2}}"><span style="width: 20px; height: 12px; border-radius: 4px; box-sizing: border-box; {{l.stil}}"></span>{{l.name}}</span>
</sc-for>
</div>
<span style="font-size: 13px; color: {{t.muted}}">Freie Zeit anklicken zum Buchen · 60 Minuten, Start zur vollen oder halben Stunde</span>
</div>

<div style="border-radius: 24px; background: {{t.surf}}; border: 1px solid {{t.line}}; box-shadow: {{t.cardShadow}}; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 64px repeat(8, minmax(0, 1fr)); border-bottom: 1px solid {{t.line}}; background: {{t.surf2}}">
<div></div>
<sc-for list="{{spalten}}" as="s" hint-placeholder-count="8">
<div style="padding: 12px 10px; border-left: 1px solid {{t.line}}"><div style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 17px">{{s.name}}</div><div style="font-size: 12px; font-weight: 600; margin-top: 1px; color: {{s.farbe}}">{{s.info}}</div></div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 64px repeat(8, minmax(0, 1fr)); position: relative">
<div style="position: relative; height: 572px">
<sc-for list="{{stunden}}" as="h" hint-placeholder-count="13">
<span style="position: absolute; right: 10px; font-size: 12px; font-weight: 600; color: {{t.muted}}; font-variant-numeric: tabular-nums; {{h.stil}}">{{h.l}}</span>
</sc-for>
</div>
<sc-for list="{{spalten}}" as="s" hint-placeholder-count="8">
<div style="position: relative; height: 572px; border-left: 1px solid {{t.line}}; background: repeating-linear-gradient(to bottom, {{t.line}} 0 1px, transparent 1px 44px)">
<sc-for list="{{s.bloecke}}" as="b" hint-placeholder-count="2">
<div style="position: absolute; left: 5px; right: 5px; box-sizing: border-box; border-radius: 11px; padding: 6px 9px; overflow: hidden; font-size: 12.5px; line-height: 1.3; {{b.stil}}">
<div style="font-weight: 700; font-variant-numeric: tabular-nums">{{b.zeit}}</div>
<div style="font-weight: 600; opacity: .9">{{b.text}}</div>
</div>
</sc-for>
</div>
</sc-for>
<div style="position: absolute; left: 58px; right: 0; top: 273px; height: 2px; background: {{t.red}}"></div>
<div style="position: absolute; left: 8px; top: 264px; height: 20px; padding: 0 6px; border-radius: 10px; background: {{t.red}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center">14:12</div>
</div>
</div>
</main>
</div>
</x-dc>
