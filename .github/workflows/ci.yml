# Prüft jeden Pull Request, bevor er nach main oder production darf.
# Die Jobnamen "verify", "e2e" und "release-check" sind in den Rulesets als
# Pflicht-Checks eingetragen - beim Umbenennen dort mitändern.
# "android" und "ios" laufen nur, wenn der PR die jeweilige App berührt.

name: CI

on:
  pull_request:
    branches: [main, production]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# Die Buchungsregeln rechnen in Vereinszeit; im UTC-Runner scheitern sonst
# die Tests zu Öffnungszeiten.
env:
  TZ: Europe/Berlin

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Neue Migrationen müssen jünger sein als alles, was im Ziel-Branch schon
      # liegt - sonst lehnt "supabase db push" sie in Dev/Prod ab, weil sie vor
      # einer bereits eingespielten Migration einsortiert würden. Passiert,
      # wenn zwei Branches parallel Migrationen anlegen.
      # Ausnahme: die Hotfix-Rückführung production -> main. Deren Migrationen
      # laufen schon in Prod und lassen sich nicht mehr umbenennen.
      - name: Zeitstempel neuer Migrationen
        if: github.head_ref != 'production'
        env:
          ZIEL: origin/${{ github.base_ref }}
        run: |
          LETZTE="$(git ls-tree --name-only "$ZIEL" supabase/migrations/ | sed 's#.*/##' | cut -d_ -f1 | sort | tail -1)"
          FEHLER=0
          for f in $(git diff --name-only --diff-filter=A "$ZIEL"...HEAD -- supabase/migrations/); do
            V="$(basename "$f" | cut -d_ -f1)"
            if [[ ! "$V" > "$LETZTE" ]]; then
              echo "::error file=$f::$V ist nicht jünger als die neueste Migration in $ZIEL ($LETZTE). Datei mit aktuellem Zeitstempel umbenennen."
              FEHLER=1
            fi
          done
          exit $FEHLER

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lokaler Supabase-Stack im Runner: Migrationen + seed.sql, dagegen
      # laufen die pgTAP-Tests. Dienste, die kein Test braucht, bleiben aus.
      - name: Supabase starten
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,mailpit,supavisor,edge-runtime

      # Wer eine Migration anlegt und "pnpm db:types" vergisst, bekäme sonst
      # einen grünen Typecheck gegen veraltete Typen. Die CLI kommt aus dem
      # Lockfile, lokal und hier erzeugt also dieselbe Version die Datei.
      - name: database.types.ts passt zu den Migrationen
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -u packages/core/src/database.types.ts /tmp/database.types.ts; then
            echo "::error file=packages/core/src/database.types.ts::Die Typen passen nicht zu den Migrationen. Lokal 'pnpm db:reset && pnpm db:types' ausführen und die Datei einchecken (danach 'pnpm --filter @tcm/core build:app-api')."
            exit 1
          fi

      - name: pnpm verify (Typecheck, Lint, Vitest, pgTAP)
        run: pnpm verify

      # Edge Functions unter Deno, ohne Stack: Deno.serve und fetch sind
      # abgefangen (supabase/functions/_tests/attrappe.ts).
      - name: Edge Functions (Deno)
        run: pnpm test:functions

      - name: Web bauen
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            pnpm --filter @tcm/web build

  # End-to-End gegen den lokalen Stack im Runner (T2). Pflicht-Check wie verify.
  # Anders als in verify laufen hier Edge Runtime (member-login) und Mailpit
  # (Einladungsmails) mit. Der Ablauf selbst ist scripts/e2e.sh wie lokal.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Supabase starten
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor

      # Dieselben Schlüssel wie lokal, nur aus dem Stack im Runner gelesen.
      # Die Konten stammen aus supabase/seed.sql.
      - name: apps/web/.env.local erzeugen
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|INBUCKET_URL|MAILPIT_URL)=')"
          cat > apps/web/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          SUPABASE_FUNCTIONS_URL=$API_URL/functions/v1
          MAILPIT_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}
          DEV_PASSWORD=tcm-lokal-2026
          DEV_USER_ADMIN=admin@tcm.local
          DEV_USER_MEMBER=mitglied@tcm.local
          DEV_USER_KIOSK=kiosk@tcm.local
          DEV_USER_NEU=neu@tcm.local
          DEV_USER_KIND=kind@tcm.local
          EOF
          grep -v KEY apps/web/.env.local

      - name: Playwright-Browser installieren
        run: pnpm --filter @tcm/web exec playwright install --with-deps chromium

      - name: End-to-End (Build, Server auf Port 3000, Playwright)
        run: bash scripts/e2e.sh --project=chromium

      - name: Server-Log
        if: failure()
        run: tail -200 /tmp/tcm-web.log /tmp/tcm-build.log || true

      - name: Bericht und Traces hochladen
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-bericht
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # Welche nativen Apps berührt der PR? Die Apps binden Dateien von außerhalb
  # ihres Ordners ein: die Golden Files (Vertrag mit @tcm/core, als
  # Testressource) und die erzeugten Tokens (als Quelltext). Ändert sich dort
  # etwas, müssen die nativen Tests ebenfalls laufen.
  native-aenderungen:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.pfade.outputs.android }}
      ios: ${{ steps.pfade.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Geänderte Pfade
        id: pfade
        env:
          ZIEL: origin/${{ github.base_ref }}
        run: |
          DATEIEN="$(git diff --name-only "$ZIEL"...HEAD)"
          GEMEINSAM='^(packages/core/golden/|packages/ui/generated/|\.github/workflows/ci\.yml$)'
          for APP in android ios; do
            if grep -qE "^apps/$APP/|$GEMEINSAM" <<< "$DATEIEN"; then
              echo "$APP=true" >> "$GITHUB_OUTPUT"
            else
              echo "$APP=false" >> "$GITHUB_OUTPUT"
            fi
          done
          cat "$GITHUB_OUTPUT"

  # JVM-Tests der Android-App: :kern gegen die Golden Files (JUnit 5), :app mit
  # Robolectric. Roborazzi zeichnet dabei nichts auf (nur mit
  # recordRoborazziLokalDebug), die Bilder in apps/android/docs bleiben unberührt.
  android:
    needs: native-aenderungen
    if: needs.native-aenderungen.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # gradle.properties verbietet das Nachladen (android.builder.sdkDownload=false),
      # deshalb hier genau die Pakete aus apps/android/README.md.
      - name: Android-SDK-Pakete
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Tests (./gradlew test)
        run: ./gradlew test --stacktrace

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-testberichte
          path: |
            apps/android/app/build/reports/tests/
            apps/android/kern/build/reports/tests/
          retention-days: 14

  # Unit-Tests der iOS-App im Simulator (Scheme TCMuckensturm, Konfiguration
  # Lokal). Die UI-Tests brauchen den lokalen Stack und ein angemeldetes
  # Seed-Konto und laufen hier nicht. Signiert wird nicht: im Simulator genügt
  # die Ad-hoc-Signatur, ein Team-Zertifikat gibt es im Runner nicht.
  ios:
    needs: native-aenderungen
    if: needs.native-aenderungen.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7

      - name: XcodeGen
        run: |
          command -v xcodegen > /dev/null || brew install xcodegen
          xcodegen --version

      # Kein Stack im Runner: die Vorlage mit Platzhalter-Schlüssel reicht, kein
      # Unit-Test spricht mit Supabase (WidgetTests überspringt den einen, der es täte).
      - name: Projekt erzeugen
        run: |
          cp Konfiguration/Lokal.geheim.xcconfig.example Konfiguration/Lokal.geheim.xcconfig
          xcodegen generate

      - name: Simulator wählen
        id: simulator
        run: |
          xcodebuild -version
          UDID="$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')"
          if [ -z "$UDID" ] || [ "$UDID" = null ]; then
            echo "::error::Kein iPhone-Simulator im Runner gefunden."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Tests (xcodebuild test)
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -project TCMuckensturm.xcodeproj -scheme TCMuckensturm \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            | tee build/xcodebuild.log | grep -E "^(Test (Suite|Case)|\*\*|.*(error|warning: unable|Executed).*)" || true
          tail -5 build/xcodebuild.log
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild.log

      - name: Log und Ergebnis hochladen
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-testergebnis
          path: |
            apps/ios/build/xcodebuild.log
            apps/ios/build/Tests.xcresult
          retention-days: 14

  # Nach production dürfen nur main (Release) und hotfix/* (Hotfix), und die
  # Version in package.json muss neu sein - sonst gäbe es den Tag schon.
  release-check:
    if: github.base_ref == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Quell-Branch prüfen
        env:
          QUELLE: ${{ github.head_ref }}
        run: |
          case "$QUELLE" in
            main|hotfix/*) echo "Quelle $QUELLE ist erlaubt." ;;
            *) echo "::error::Nach production nur aus main oder hotfix/*, nicht aus $QUELLE."; exit 1 ;;
          esac

      - name: Version prüfen
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION gibt es schon. Version in package.json hochzählen (chore/release-x.y.z bzw. im Hotfix-Branch)."
            exit 1
          fi
          echo "Release wird v$VERSION."
